# Gated client-release skeleton. Dispatch-only: this workflow never runs on
# push or pull_request. It stays inert until BOTH preconditions hold:
#   1. the repo variable CLIENT_RELEASE_ENABLED is set to "1", and
#   2. the client-release-production environment holds the secret names listed
#      in config/client-update-trust.json.
# Distribution target: GitHub Releases of the PUBLIC repository
# gualtier-xu/Fudan-CourseLens (ADR 0006). Downloads are anonymous; public
# download adds no trust — the offline root key, online release key, signed
# manifest and SHA-256/size checks are unchanged. There is no code signing
# (2026-09-30 decision): SHA256SUMS.txt plus the Ed25519-signed manifest are
# the release trust base.
# The final job stops at a DRAFT release: it creates the draft, uploads the
# built assets, and never publishes. A human must independently verify
# (manifest signature, SHA-256 vs manifest and SHA256SUMS.txt, exact size,
# notes review) and only then publish manually:
#   gh release edit <tag> --draft=false --repo gualtier-xu/Fudan-CourseLens
# Immutable releases: enable the repository's immutable-releases setting at or
# before the first publish so published release assets can never be replaced
# or deleted. Never replace a published asset; fix forward with a new
# client-v<semver> release instead.
# Per the 2026-09-30 signing decision there is no Authenticode step; see
# docs/client-update-operations.md for the checksum-sheet release flow.
name: Client release (gated skeleton)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, client-v<semver> (for example client-v1.1.0)"
        required: true
      package_url:
        description: "Package asset URL under https://github.com/gualtier-xu/Fudan-CourseLens/releases/download/<release_tag>/"
        required: true
      release_notes:
        description: "Release notes (stored in the signed manifest, max 8000 chars)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  release-gate-audit:
    if: vars.CLIENT_RELEASE_ENABLED == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.10"
      - name: Fail-closed release gate audit
        run: python scripts/check_client_release_gates.py --require-release-ready

  build-and-sign:
    if: vars.CLIENT_RELEASE_ENABLED == '1'
    needs: release-gate-audit
    runs-on: windows-2025
    timeout-minutes: 20
    environment: client-release-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.10"
      - name: Validate dispatch inputs (fail closed)
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
          PACKAGE_URL: ${{ github.event.inputs.package_url }}
        shell: bash
        run: |
          set -eu
          printf '%s' "$RELEASE_TAG" |
            grep -Eq '^client-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$' || {
              echo "release_tag must match client-v<semver>" >&2
              exit 1
            }
          case "$PACKAGE_URL" in
            "https://github.com/gualtier-xu/Fudan-CourseLens/releases/download/$RELEASE_TAG/"*) ;;
            *) echo "package_url must start with https://github.com/gualtier-xu/Fudan-CourseLens/releases/download/$RELEASE_TAG/" >&2
               exit 1 ;;
          esac
      - name: Build the allowlisted signed update package
        env:
          COURSELENS_UPDATE_RELEASE_SIGNING_KEY: ${{ secrets.COURSELENS_UPDATE_RELEASE_SIGNING_KEY }}
        shell: pwsh
        run: |
          if (-not $env:COURSELENS_UPDATE_RELEASE_SIGNING_KEY) {
            throw "COURSELENS_UPDATE_RELEASE_SIGNING_KEY is not configured in client-release-production"
          }
          $keyPath = Join-Path $env:RUNNER_TEMP ("release-signing-key-{0}.b64" -f $env:GITHUB_RUN_ID)
          [IO.File]::WriteAllText(
            $keyPath,
            $env:COURSELENS_UPDATE_RELEASE_SIGNING_KEY.Trim(),
            (New-Object System.Text.UTF8Encoding($false)))
          $notesPath = Join-Path $env:RUNNER_TEMP ("release-notes-{0}.md" -f $env:GITHUB_RUN_ID)
          [IO.File]::WriteAllText($notesPath, "${{ github.event.inputs.release_notes }}")
          $outRoot = Join-Path $env:RUNNER_TEMP ("client-release-{0}" -f $env:GITHUB_RUN_ID)
          python scripts/build_client_update.py `
            --root . `
            --output $outRoot `
            --package-url "${{ github.event.inputs.package_url }}" `
            --release-id "ci-$($env:GITHUB_RUN_ID)" `
            --key-id release-2026-01 `
            --key-epoch 1 `
            --signing-key-file $keyPath `
            --notes-file $notesPath
      - name: Remove signing-key material
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem -Path $env:RUNNER_TEMP -Filter "release-signing-key-*.b64" |
            Remove-Item -Force
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: client-release-package
          path: ${{ runner.temp }}/client-release-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14

  # Creates a DRAFT release on the public repository, uploads every built
  # asset, and stops. Publishing is always a manual, independently verified
  # step (see the job summary and docs/client-update-operations.md).
  publish-draft-release:
    if: vars.CLIENT_RELEASE_ENABLED == '1'
    needs: build-and-sign
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: client-release-production
    permissions:
      actions: read
      contents: read
    steps:
      - name: Fail closed without the release publisher token
        env:
          COURSELENS_RELEASE_PUBLISHER_TOKEN: ${{ secrets.COURSELENS_RELEASE_PUBLISHER_TOKEN }}
        run: |
          if [ -z "${COURSELENS_RELEASE_PUBLISHER_TOKEN:-}" ]; then
            echo "COURSELENS_RELEASE_PUBLISHER_TOKEN is not configured in client-release-production" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Download the built release artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh run download "$GITHUB_RUN_ID" --name client-release-package --dir release-package
          ls -l release-package
      # The updater pins the manifest asset name in the trust policy; the build
      # emits plain manifest.json, so rename it before upload and fail closed
      # if the policy name ever drifts from this workflow's pin.
      - name: Rename the built manifest to the policy-pinned asset name
        env:
          EXPECTED_MANIFEST_ASSET: courselens-windows-manifest.json
        run: |
          set -eu
          manifest_asset="$(python3 -c 'import json; print(json.load(open("config/client-update-trust.json"))["manifest_asset"])')"
          if [ "$manifest_asset" != "$EXPECTED_MANIFEST_ASSET" ]; then
            echo "trust policy manifest_asset is now '$manifest_asset'; update the updater pin and this workflow together" >&2
            exit 1
          fi
          mv release-package/manifest.json "release-package/$manifest_asset"
          echo "MANIFEST_ASSET=$manifest_asset" >> "$GITHUB_ENV"
      # No code signing (2026-09-30 decision): the checksum sheet is the
      # human-verifiable companion to the Ed25519-signed manifest, which binds
      # the same package digest.
      - name: Generate the SHA256 checksum sheet
        run: sha256sum release-package/*.zip | tee release-package/SHA256SUMS.txt
      - name: Create draft release, upload assets, then stop before publish
        env:
          GH_TOKEN: ${{ secrets.COURSELENS_RELEASE_PUBLISHER_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
          RELEASE_NOTES: ${{ github.event.inputs.release_notes }}
        run: |
          notes_file="$(mktemp)"
          printf '%s' "$RELEASE_NOTES" > "$notes_file"
          gh release create "$RELEASE_TAG" \
            --repo gualtier-xu/Fudan-CourseLens \
            --draft \
            --title "$RELEASE_TAG" \
            --notes-file "$notes_file"
          gh release upload "$RELEASE_TAG" \
            --repo gualtier-xu/Fudan-CourseLens \
            release-package/*.zip "release-package/$MANIFEST_ASSET" \
            release-package/SHA256SUMS.txt
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## Draft release created — publishing is a MANUAL step
          The release is still a draft. Before publishing, independently verify:
          1. Manifest signature: verify manifest.json against the authorized release key.
          2. SHA-256: recompute the package digest and compare it with manifest.json
             and SHA256SUMS.txt.
          3. Size: confirm the exact package byte size recorded in manifest.json.
          4. Notes: review the release notes for secrets or unintended content.
          Then publish with:
          gh release edit <tag> --draft=false --repo gualtier-xu/Fudan-CourseLens
          Never replace published assets (immutable releases); fix forward with
          a new client-v<semver> release.
          SUMMARY
          echo "Draft release $RELEASE_TAG created; stopping before publish."
