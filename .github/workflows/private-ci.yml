name: Private monorepo CI

# Milestone validation matrix. Pull requests run the lightweight
# private-ci-routine.yml instead; dispatch this workflow manually on a
# milestone branch before merging it, or rely on the push-to-main run.
#
# Quota guard: the macOS matrix leg is dispatch-only. Job-level `if` cannot
# reference runner/matrix contexts, so the gate is applied per step; on push
# to main every `test (macos-15)` step is skipped and only its ~1-minute
# runner boot is billed at the 10x macOS multiplier.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: runner.os != 'macOS' || github.event_name == 'workflow_dispatch'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        if: runner.os != 'macOS' || github.event_name == 'workflow_dispatch'
        with:
          python-version: "3.10"
          cache: pip
      - name: Install pinned test runtime
        if: runner.os != 'macOS' || github.event_name == 'workflow_dispatch'
        run: |
          python -m pip install --requirement requirements-client-py310.lock.txt
          python -m pip install --requirement requirements-test-py310.lock.txt
      - name: Install Windows Worker test runtime
        if: runner.os == 'Windows'
        run: python -m pip install --requirement worker/requirements.txt
      - name: Run private client tests on Windows
        if: runner.os == 'Windows'
        run: python -m pytest -q
      - name: Run Worker tests on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $separator = [System.IO.Path]::PathSeparator
          $env:PYTHONPATH = "worker${separator}."
          python -m unittest discover -s worker/tests -p 'test_*.py' -q
      - name: Run portable client tests on macOS
        if: runner.os == 'macOS' && github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          python -m pytest -q `
            tests/test_api_v3_media_routes.py `
            tests/test_auth_timeouts.py `
            tests/test_catalog_repository.py `
            tests/test_icourse_video_url.py `
            tests/test_legacy_cleanup.py `
            tests/test_optional_compute_imports.py `
            tests/test_remote_protocol.py `
            tests/test_worker_mirror.py `
            tests/test_worker_mirror_publish.py
      - name: Validate macOS portable runtime
        if: runner.os == 'macOS' && github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          python -c "import src; import src.app; import src.runtime.http_api; import credentials"
          python scripts/portable_runtime_manifest.py
          python -c "import json, pathlib; value=json.loads(pathlib.Path('runtime/portable-runtime-manifest.json').read_text(encoding='utf-8')); assert value['files']"
      - name: Compile Python
        if: runner.os == 'Windows'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m compileall -q credentials.py path_utils.py src shared scripts tests worker/courselens_worker worker/scripts worker/tests
      - name: Check frontend JavaScript
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem frontend -Recurse -Filter *.js | ForEach-Object { node --check $_.FullName }
      - name: Check text, links and patches
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/check_text_encoding.py
          python scripts/check_markdown_links.py
          python scripts/check_online_only_residue.py
          git diff --check
      - name: Validate online-only catalog and cleanup guards
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pytest -q tests/test_catalog_repository.py tests/test_legacy_cleanup.py tests/test_api_v3_media_routes.py
          python scripts/cleanup_legacy.py --report runtime/reports/legacy-cleanup-ci.json

  windows-lifecycle-e2e:
    runs-on: windows-2025
    timeout-minutes: 10
    env:
      COURSELENS_WINDOWS_LIFECYCLE_E2E: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.10"
          cache: pip
      - name: Install pinned lifecycle test runtime
        run: |
          python -m pip install --requirement requirements-client-py310.lock.txt
          python -m pip install --requirement requirements-test-py310.lock.txt
      - name: Run isolated Windows lifecycle E2E
        timeout-minutes: 6
        env:
          COURSELENS_WINDOWS_LIFECYCLE_ROOT: ${{ runner.temp }}\courselens-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}
          COURSELENS_WINDOWS_LIFECYCLE_PID_LEDGER: ${{ runner.temp }}\courselens-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}.jsonl
        run: python -m pytest -q tests/test_windows_lifecycle_e2e.py
      - name: Clean isolated Windows lifecycle processes
        if: always()
        shell: pwsh
        env:
          COURSELENS_WINDOWS_LIFECYCLE_ROOT: ${{ runner.temp }}\courselens-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}
          COURSELENS_WINDOWS_LIFECYCLE_PID_LEDGER: ${{ runner.temp }}\courselens-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}.jsonl
        run: |
          $ciRoot = [System.IO.Path]::GetFullPath($env:COURSELENS_WINDOWS_LIFECYCLE_ROOT)
          $runnerRoot = [System.IO.Path]::GetFullPath($env:RUNNER_TEMP)
          $runnerPrefix = $runnerRoot.TrimEnd('\') + '\'
          if (-not $ciRoot.StartsWith($runnerPrefix, [System.StringComparison]::OrdinalIgnoreCase)) {
            throw "Lifecycle CI root escaped RUNNER_TEMP"
          }
          if (-not (Test-Path -LiteralPath $env:COURSELENS_WINDOWS_LIFECYCLE_PID_LEDGER -PathType Leaf)) {
            exit 0
          }
          $ciPrefix = $ciRoot.TrimEnd('\') + '\'
          $remaining = @()
          Get-Content -LiteralPath $env:COURSELENS_WINDOWS_LIFECYCLE_PID_LEDGER | ForEach-Object {
            try { $entry = $_ | ConvertFrom-Json } catch { return }
            $pidValue = 0
            if (-not [int]::TryParse([string]$entry.pid, [ref]$pidValue) -or $pidValue -le 0) { return }
            try { $dataRoot = [System.IO.Path]::GetFullPath([string]$entry.data_root) } catch { return }
            if (-not $dataRoot.StartsWith($ciPrefix, [System.StringComparison]::OrdinalIgnoreCase)) { return }
            $process = Get-CimInstance Win32_Process -Filter "ProcessId = $pidValue" -ErrorAction SilentlyContinue
            if (-not $process) { return }
            $command = [string]$process.CommandLine
            if ($command -notmatch '(?i)COURSELENS_WINDOWS_LIFECYCLE_CHILD' -or $command.IndexOf($dataRoot, [System.StringComparison]::OrdinalIgnoreCase) -lt 0) {
              $remaining += $pidValue
              return
            }
            & taskkill.exe /PID $pidValue /T /F 2>$null | Out-Null
          }
          foreach ($entryLine in Get-Content -LiteralPath $env:COURSELENS_WINDOWS_LIFECYCLE_PID_LEDGER) {
            try { $entry = $entryLine | ConvertFrom-Json } catch { continue }
            $pidValue = 0
            if (-not [int]::TryParse([string]$entry.pid, [ref]$pidValue) -or $pidValue -le 0) { continue }
            try { $dataRoot = [System.IO.Path]::GetFullPath([string]$entry.data_root) } catch { continue }
            if (-not $dataRoot.StartsWith($ciPrefix, [System.StringComparison]::OrdinalIgnoreCase)) { continue }
            $process = Get-CimInstance Win32_Process -Filter "ProcessId = $pidValue" -ErrorAction SilentlyContinue
            if (-not $process) { continue }
            $command = [string]$process.CommandLine
            if ($command -match '(?i)COURSELENS_WINDOWS_LIFECYCLE_CHILD' -and $command.IndexOf($dataRoot, [System.StringComparison]::OrdinalIgnoreCase) -ge 0) {
              $remaining += $pidValue
            }
          }
          if ($remaining.Count -gt 0) {
            throw "Lifecycle CI left registered processes: $(($remaining | Sort-Object -Unique) -join ',')"
          }

  dependency-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.10"
          cache: pip
      - name: Audit pinned dependencies and generate SBOMs
        run: |
          python -m pip install --disable-pip-version-check pip==26.1.2 pip-audit==2.10.1
          mkdir -p runtime/reports/dependency-audit
          python -m pip_audit -r requirements-client-py310.lock.txt --format json --output runtime/reports/dependency-audit/client.json
          python -m pip_audit -r requirements-test-py310.lock.txt --format json --output runtime/reports/dependency-audit/test.json
          python -m pip_audit -r worker/requirements.txt --format json --output runtime/reports/dependency-audit/worker.json
          python -m pip_audit -r requirements-client-py310.lock.txt --format cyclonedx-json --output runtime/reports/dependency-audit/client.cdx.json
          python -m pip_audit -r requirements-test-py310.lock.txt --format cyclonedx-json --output runtime/reports/dependency-audit/test.cdx.json
          python -m pip_audit -r worker/requirements.txt --format cyclonedx-json --output runtime/reports/dependency-audit/worker.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dependency-audit-and-sbom
          path: runtime/reports/dependency-audit
          if-no-files-found: error
          retention-days: 14

  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ github.token }}
